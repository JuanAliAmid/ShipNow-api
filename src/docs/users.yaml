tags:
  - name: Users
    description: Gestión de Usuarios

paths:
  /api/users:
    get:
      tags:
        - Users
      summary: Listar usuarios
      description: Obtiene un lista de usuarios
      responses: 
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor
    post:
      tags:
        - Users
      summary: Crear usuario
      description: Crea un nuevo usuario
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400":
          description: El formato de los datos ingresados es incorrecto o Faltan datos obligatorios 
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidData:
                  value:
                    status: error
                    error: INVALID_DATA
                    message: El formato de los datos ingresados es incorrecto
                requiredFields:
                  value:
                    status: error
                    error: REQUIRED_FIELDS
                    message: Faltan datos obligatorios
        "409":
          description: El email ingresado ya se encuentra registrado
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: DUPLICATE_EMAIL_ADDRESS
                message: El email ingresado ya se encuentra registrado
        "500":
          description:  Error interno del servidor 
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor 
  /api/users/{uid}:
    parameters:
      - name: uid
        in: path
        required: true
        description: ID del usuario
        schema:
          type: string
        example: 6ab4331ecc0e40d9547ef358
    get:
      tags: 
        - Users
      summary: Obtener un usuario por ID
      description: Obtiene un usuario por el ID ingresado
      responses:
        "200":
          description: Usuario obtenido por ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400":
          description:  ID inválido
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INVALID_DATA
                message: El formato de los datos ingresados es incorrecto
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: USER_NOT_FOUND
                message: Usuario no encontrado
        "500":
          description:  Error interno del servidor 
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor
    put:
      tags:
        - Users
      summary: Actualizar usuario
      description: Actualiza el usuario con lo nuevos datos ingresados
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'
      responses:
        "200":
          description: Usuario Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400":
          description:  El formato de los datos ingresados es incorrecto 
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INVALID_DATA
                message:  El formato de los datos ingresados es incorrecto 
        "404":
          description: Usuario no encontrado 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: USER_NOT_FOUND
                message: Usuario no encontrado 
        "409":
          description: El email ingresado ya se encuentra registrado
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: DUPLICATE_EMAIL_ADDRESS
                message: El email ingresado ya se encuentra registrado
        "500":
          description:  Error interno del servidor 
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor 
    delete:
      tags: 
        - Users
      summary: Eliminar un usuario
      description: Elimina un usuario a través de su ID
      responses:
        "200":
          description: Elimina un usuario por ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400":
          description:  ID inválido
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INVALID_DATA
                message: El formato de los datos ingresados es incorrecto
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: USER_NOT_FOUND
                message: Usuario no encontrado
        "500":
          description:  Error interno del servidor 
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor
  /api/users/{uid}/documents:
    parameters:
      - name: uid
        in: path
        required: true
        description: ID del Usuario
        schema:
          type: string
        example: 6ab430314443efb186ab6a65
    post:
      tags:
        - Users
      summary: Subir un documento del Usuario
      description: Agrega un documento al array de documentos del Usuario. Los anteriores se conservan. Formatos permitidos PDF, JPEG, PNG y WEBP, con un tamaño máximo de 5 MB.      
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - document
                - documentType
              properties:
                document:
                  type: string
                  format: binary
                documentType:
                  type: string
                  enum:
                    - document
                    - license
                  example: document
      responses:
        "200":
          description: Documento cargado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400":
          description: No se recibió el archivo / Tipo de archivo inválido / Archivo demasiado grande / Campo inesperado / ID con formato inválido / Tipo de documento inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notReceivedFile:
                  value:
                    status: error
                    error: NOT_RECIVED_FILE
                    message: No se recibió ningún archivo
                invalidFileType:
                  value:
                    status: error
                    error: INVALID_FILE_TYPE
                    message: Tipo de archivo inválido
                limitFileSize:
                  value:
                    status: error
                    error: LIMIT_FILE_SIZE
                    message: Se excedió el limite de tamaño permitido
                limitUnexpectedFile:
                  value:
                    status: error
                    error: LIMIT_UNEXPECTED_FILE
                    message: Campo de archivo con nombre incorrecto
                invalidData:
                  value:
                    status: error
                    error: INVALID_DATA
                    message: El formato de los datos ingresados es incorrecto
                invalidDocumentType:
                  value:
                    status: error
                    error: INVALID_DOCUMENT_TYPE
                    message: Tipo de documento inválido
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: USER_NOT_FOUND
                message: Usuario no encontrado
        "500":
          description: Error interno del servidor o Error al guardar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalServerError:
                  value:
                    status: error
                    error: INTERNAL_SERVER_ERROR
                    message: Error interno del servidor
                saveFileFailed:
                  value:
                    status: error
                    error: SAVE_FILE_FAILED
                    message: Error al guardar

components:
  schemas:
    User: 
      type: object
      properties: 
        _id:
          type: string
          example: 6ab4331ecc0e40d9547ef359
        firstName:
          type: string
          example: Sofia
        lastName:
          type: string
          example: Ramirez
        email:
          type: string
          example: sofia15@email.com
        role: 
          type: string
          enum:
            - admin
            - customer
            - store
            - driver
          default: customer
        documents:
          type: array
          items:
            $ref: '#/components/schemas/UserDocument'
    UserResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message: 
          type: string
          example: Usuario obtenido por _id
        payload:
          $ref: "#/components/schemas/User"
    UsersResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message: 
          type: string
          example: Usuarios obtenidos 
        payload:
          type: array
          items:
            $ref: "#/components/schemas/User"
    UserInput:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
          example: Sofia
        lastName:
          type: string
          example: Ramirez
        email:
          type: string
          example: sofia15@email.com
        password:
          type: string
          example: miClave123
        role:
          type: string
          enum: 
            - admin
            - customer
            - store
            - driver
          example: customer
    UserUpdateInput:
      type: object
      properties:
        firstName:
          type: string
          example: Sofia
        lastName:
          type: string
          example: Ramirez
        email:
          type: string
          example: sofia15@email.com
        password:
          type: string
          example: miClave123
        role:
          type: string
          enum: 
            - admin
            - customer
            - store
            - driver
          example: customer
    UserDocument:
      allOf:
        - $ref: '#/components/schemas/FileReceipt'
        - type: object
          properties:
            documentType:
              type: string
              enum:
                - document
                - license
              example: license