tags:
  - name: Deliveries
    description: Gestión de Deliveries

paths:
  /api/deliveries:
    get:
      tags:
        - Deliveries
      summary: Listar Deliverys
      description: Obtiene una lista de deliverys
      responses: 
        "200":
          description: Lista de Deliveries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveriesResponse'
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: 
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor

  /api/deliveries/{did}:
    parameters:
      - name: did
        in: path
        required: true
        description: ID del delivery
        schema:
          type: string
        example: 6ab4331ecc0e40d9547ef358
    get:
      tags: 
        - Deliveries
      summary: Obtener un delivery por ID
      description: Obtiene un delivery por el ID ingresado
      responses:
        "200":
          description: Delivery obtenido por ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        "400":
          description:  ID inválido
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example: 
                status: error
                error: INVALID_DATA
                message: El formato de los datos ingresados es incorrecto
        "404":
          description:  Delivery no encontrado
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example: 
                status: error
                error: DELIVERY_NOT_FOUND
                message: Delivery no encontrado
        "500":
          description:  Error interno del servidor 
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example: 
                  status: error
                  error: INTERNAL_SERVER_ERROR
                  message: Error interno del servidor
  /api/deliveries/{did}/status:
    parameters:
    - name: did
      in: path
      required: true
      description: ID del delivery
      schema:
        type: string
      example: 6ab4331ecc0e40d9547ef353
    put:
      tags:
        - Deliveries
      summary: Actualizar estado de delivery
      description: Actualiza el estado del delivery a través del id ingresado
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryStatusInput'
      responses:
        "200":
          description: Estado Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        "400":
          description:  El formato de los datos ingresados es incorrecto o Estado inválido
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                dataInvalid:
                  value:
                    status: error
                    error: INVALID_DATA
                    message: El formato de los datos ingresados es incorrecto
                statusInvalid:
                  value:
                    status: error
                    error: INVALID_DELIVERY_STATUS
                    message: El estado ingresado no es válido para una entrega
        "404":
          description:  Delivery no encontrado
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example: 
                status: error
                error: DELIVERY_NOT_FOUND
                message: Delivery no encontrado
        "500":
          description:  Error interno del servidor 
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example: 
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor

components:
  schemas:
    Delivery: 
      type: object
      properties: 
        _id:
          type: string
          example: 6ab4331ecc0e40d9547ef359
        order:
          type: string
          example: 6ab4331ecc0e42d9547ef356
        driver:
          type: string
          example: 6ab4331ecc0e40d9547ef350
        status:
          type: string
          enum:
            - assigned
            - cancelled
            - delivered
            - in_transit
          default: assigned
        priority: 
          type: string
          enum:
            - normal
            - low
            - high
          default: normal
        notes:
          type: string
          example: Dejar en recepción
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeliveryResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message: 
          type: string
          example: Delivery obtenido por id
        payload:
          $ref: "#/components/schemas/Delivery"
    DeliveriesResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message: 
          type: string
          example: Lista de deliveries 
        payload:
          type: array
          items:
            $ref: "#/components/schemas/Delivery"
    DeliveryStatusInput:
      type: object
      required: 
        - status
      properties:
        status:
          type: string
          enum:
            - assigned
            - cancelled
            - delivered
            - in_transit
          example: in_transit
