tags:
  - name: Products
    description: Gestión de productos

paths:
  /api/products:
    get:
      tags:
        - Products
      summary: Obtener productos con status available
      description: Devuelve la lista paginada de productos con status available.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Número de página (si es inválido, se usa 1)
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            maximum: 50
          description: Resultados por página (si es inválido, se usa 10; si supera 50, se usa 50)
      responses:
        "200":
          description: Productos obtenidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsResponse'
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Products
      summary: Crear producto
      description: Crea un nuevo producto. Requiere name, price y quantity.
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        "400":
          description: El formato de los datos ingresados es incorrecto / Faltan datos obligatorios
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidData:
                  value:
                    status: error
                    error: INVALID_DATA
                    message: El formato de los datos ingresados es incorrecto
                requiredFields:
                  value:
                    status: error
                    error: REQUIRED_FIELDS
                    message: Faltan datos obligatorios
        "500":
          description:  Error interno del servidor 
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor 
    /api/products/{id}:
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID del producto
      get:
        tags:
          - Products
        summary: Obtener producto por ID
        responses:
          "200":
            description: Producto obtenido
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProductResponse'
          "400":
            description: El formato del ID es inválido
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
                example:
                  status: error
                  error: INVALID_DATA
                  message: El formato de los datos ingresados es incorrecto
          "404":
            description: Producto no encontrado
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
                example:
                  status: error
                  error: PRODUCT_NOT_FOUND
                  message: Producto no encontrado
      put:
        tags:
          - Products
        summary: Actualizar producto
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductUpdateInput'
        responses:
          "200":
            description: Producto actualizado
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProductResponse'
          "400":
            description: Datos o ID inválidos
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
          "404":
            description: Producto no encontrado
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
      delete:
        tags:
          - Products
        summary: Eliminar producto
        responses:
          "200":
            description: Producto eliminado
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProductResponse'
          "400":
            description: El formato del ID es inválido
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
          "404":
            description: Producto no encontrado
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Product: 
      type: object
      properties: 
        _id:
          type: string
          example: 6ab4331ecc0e40d9547ef359
        name:
          type: string
          example: Producto16
        price:
          type: number
          example: 1500
        quantity:
          type: number
          example: 4
        status:
          type: string
          enum:
            - available
            - out of stock
          example: available
    ProductResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message: 
          type: string
          example: Producto creado
        payload:
          $ref: "#/components/schemas/Product"
    ProductsResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message: 
          type: string
          example: Lista de productos  
        payload:
          type: array
          items:
            $ref: "#/components/schemas/Product"
    ProductInput:
      type: object
      required:
        - name
        - price
        - quantity
      properties:
        name:
          type: string
          example: Producto12
        price:
          type: number
          example: 6000
        quantity:
          type: number
          example: 6
        status:
          type: string
          enum:
            - available
            - out of stock
          example: available
    ProductUpdateInput:
      type: object
      properties:
        name:
          type: string
          example: Producto12
        price:
          type: number
          example: 6000
        quantity:
          type: number
          example: 6
        status:
          type: string
          enum:
            - available
            - out of stock
          example: available
