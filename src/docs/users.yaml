tags:
  - name: Users
    description: Gestión de Usuarios

paths:
  /api/users:
    get:
      tags:
        - Users
      summary: Listar usuarios
      description: Obtiene un lista de usuarios
      responses: 
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor
    post:
      tags:
        - Users
      summary: Crear usuario
      description: Crea un nuevo usuario
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400":
          description: El formato de los datos ingresados es incorrecto o Faltan datos obligatorios 
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidData:
                  status: error
                  error: INVALID_DATA
                  message: El formato de los datos ingresados es incorrecto
                requiredFields:
                  status: error
                  error: REQUIRED_FIELDS
                  message: Faltan datos obligatorios
        "409":
          description: El email ingresado ya se encuentra registrado
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: DUPLICATE_EMAIL_ADDRESS
                message: El email ingresado ya se encuentra registrado
        "500":
          description:  Error interno del servidor 
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor 
  /api/users/{uid}:
    parameters:
      - name: uid
        in: path
        required: true
        description: ID del usuario
        schema:
          type: string
        example: 6ab4331ecc0e40d9547ef358
    get:
      tags: 
        - Users
      summary: Obtener un usuario por ID
      description: Obtiene un usuario por el ID ingresado
      responses:
        "200":
          description: Usuario obtenido por ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400":
          description:  ID inválido
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INVALID_DATA
                message: El formato de los datos ingresados es incorrecto
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
              example:
                status: error
                error: USER_NOT_FOUND
                message: Usuario no encontrado
        "500":
          description:  Error interno del servidor 
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor
    put:
      tags:
        - Users
      summary: Actualizar usuario
      description: Actualiza el usuario con lo nuevos datos ingresados
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        "200":
          description: Usuario Actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400":
          description:  El formato de los datos ingresados es incorrecto 
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INVALID_DATA
                message:  El formato de los datos ingresados es incorrecto 
        "404":
          description: Usuario no encontrado 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
              example:
                status: error
                error: USER_NOT_FOUND
                message: Usuario no encontrado 
        "500":
          description:  Error interno del servidor 
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor 
    delete:
      tags: 
        - Users
      summary: Eliminar un usuario
      description: Elimina un usuario a través de su ID
      responses:
        "200":
          description: Elimina un usuario por ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        "400":
          description:  ID inválido
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INVALID_DATA
                message: El formato de los datos ingresados es incorrecto
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
              example:
                status: error
                error: USER_NOT_FOUND
                message: Usuario no encontrado
        "500":
          description:  Error interno del servidor 
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor

components:
  schemas:
    User: 
      type: object
      properties: 
        _id:
          type: string
          example: 6ab4331ecc0e40d9547ef359
        firstName:
          type: string
          example: Sofia
        lastName:
          type: string
          example: Ramirez
        email:
          type: string
          example: sofia15@email.com
        role: 
          type: string
          enum:
            - admin
            - customer
            - store
            - driver
          default: customer
    UserResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message: 
          type: string
          example: Usuario obtenido por _id
        payload:
          $ref: "#/components/schemas/User"
    UsersResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message: 
          type: string
          example: Usuarios obtenidos 
        payload:
          type: array
          items:
            $ref: "#/components/schemas/User"
    UserInput:
      type: object
      properties:
        firstName:
          type: string
          example: Sofia
        lastName:
          type: string
          example: Ramirez
        email:
          type: string
          example: sofia15@email.com
        password:
          type: string
          example: miClave123
        role:
          type: string
          enum: 
            - admin
            - customer
            - store
            - driver
          example: customer
