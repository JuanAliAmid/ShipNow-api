tags:
  - name: Products
    description: Gestión de productos

paths:
  /api/products:
    post:
      tags:
        - Products
      summary: Crear producto
      description: Crea un nuevo producto. Requiere name, price y quantity.
      requestBody: 
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        "400":
          description: El formato de los datos ingresados es incorrecto / Faltan datos obligatorios
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidData:
                  value:
                    status: error
                    error: INVALID_DATA
                    message: El formato de los datos ingresados es incorrecto
                requiredFields:
                  value:
                    status: error
                    error: REQUIRED_FIELDS
                    message: Faltan datos obligatorios
        "500":
          description:  Error interno del servidor 
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor 
    get:
      tags:
        - Products
      summary: Obtener productos con status available
      description: Devuelve la lista de productos con status available.
      responses:
        "200":
          description: Productos obtenidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsResponse'
        "500":
          description:  Error interno del servidor 
          content: 
            application/json:
              schema: 
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Error interno del servidor 
components:
  schemas:
    Product: 
      type: object
      properties: 
        _id:
          type: string
          example: 6ab4331ecc0e40d9547ef359
        name:
          type: string
          example: Producto16
        price:
          type: number
          example: 1500
        quantity:
          type: number
          example: 4
        status:
          type: string
          enum:
            - available
            - out of stock
          example: available
    ProductResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message: 
          type: string
          example: Producto creado
        payload:
          $ref: "#/components/schemas/Product"
    ProductsResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message: 
          type: string
          example: lista de productos  
        payload:
          type: array
          items:
            $ref: "#/components/schemas/Product"
    ProductInput:
      type: object
      required:
        - name
        - price
        - quantity
      properties:
        name:
          type: string
          example: Producto12
        price:
          type: number
          example: 6000
        quantity:
          type: number
          example: 6
        status:
          type: string
          enum:
            - available
            - out of stock
          example: available
